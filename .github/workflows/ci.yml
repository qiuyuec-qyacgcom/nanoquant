name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 本地跑的是 3.13，CI 长期只测 3.12 —— 版本偏移会让"本地过、CI 挂"变成常态
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        # 只开 F/E9：未定义名字、未使用导入、重复定义这类"几乎一定是 bug"的规则
        run: python -m ruff check .

      - name: Type check (mypy)
        # 配置在 mypy.ini；当前基线是 0 错误，破了就说明引入了新的类型问题
        run: python -m mypy

      - name: Byte-compile
        run: python -m compileall -q nanoquant

      - name: Tests + coverage
        # 门槛只防"大幅倒退"：当前基线 68%，留 4 个点余量给跨平台差异。
        # 改这里的数字时请同步改这行注释 —— 上一版注释还写着 52，早就和参数脱节了。
        run: python -m pytest tests -q --cov=nanoquant --cov-report=term-missing --cov-fail-under=64

  rust:
    name: rust (sidecar)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/exec-service
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo test
        run: cargo test --release

  audit:
    name: deps (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit runtime dependencies
        # 先跑起来把家底摸清; 等基线清干净后再去掉 continue-on-error 变成硬门禁
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --progress-spinner off

  e2e:
    name: e2e (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          cd frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Start backend
        run: |
          mkdir -p "$GITHUB_WORKSPACE/logs" "$GITHUB_WORKSPACE/data"
          cd backend
          export NANOQUANT_HOME="$GITHUB_WORKSPACE"
          export NANOQUANT_DATA_DIR="$GITHUB_WORKSPACE/data"
          export NANOQUANT_LOG_DIR="$GITHUB_WORKSPACE/logs"
          export NANOQUANT_DB="$GITHUB_WORKSPACE/data/e2e.db"
          export NANOQUANT_FRONTEND="$GITHUB_WORKSPACE/frontend/dist"
          nohup python -m nanoquant > "$GITHUB_WORKSPACE/logs/stdout.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8899/api/v1/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$GITHUB_WORKSPACE/logs/stdout.log"; exit 1

      - name: Seed admin password
        # 出厂密码状态下后台接口会被 403 拦下（main._force_password_change）。
        # 这里按真实用户流程把密码改掉，后面的用例才有意义。
        run: |
          python - <<'PY'
          import json, urllib.request
          BASE = "http://127.0.0.1:8899/api/v1"

          def post(path, body, token=""):
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              req = urllib.request.Request(BASE + path, data=json.dumps(body).encode(), headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return json.load(resp)

          token = post("/auth/login", {"username": "admin", "password": "admin123"})["token"]
          post("/auth/password", {"old_password": "admin123", "new_password": "e2e-Pass-1234"}, token)
          print("admin password seeded")
          PY

      - name: Playwright smoke
        env:
          E2E_PASS: e2e-Pass-1234
        run: cd frontend && npx playwright test

      - name: Logs on failure
        if: failure()
        run: tail -100 "$GITHUB_WORKSPACE/logs/stdout.log"

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (vitest)
        # 纯逻辑单测：比 e2e 快两个量级，格式化/换算类回归先在这里拦
        run: npm test

      - name: Build
        run: npm run build
