; mypy: type-check the nanoquant package only (tests are out of scope)
;
; NOTE: keep this file ASCII-only. Python 3.11's configparser reads it with the
; locale encoding, so UTF-8 Chinese comments crash mypy on a Chinese Windows
; (cp936): UnicodeDecodeError: 'gbk' codec can't decode byte ...
;
;   mypy                                   # uses this file
;   mypy nanoquant/services/retention.py   # single module
;
; Gate: we are at 0 errors, so keep it at 0. Any ignore must explain itself;
; never use a blanket --ignore-errors, that just disables the check silently.
[mypy]
python_version = 3.11
files = nanoquant
ignore_missing_imports = True
; check function bodies too: the bugs we hit (list assigned to int, None.items()) were inside them
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_configs = True
show_error_codes = True
; third-party stubs (SQLAlchemy Result / pydantic generics) are noisy here:
; a point `# type: ignore[...]` is fine, a module-wide ignore is not
warn_unused_ignores = True
