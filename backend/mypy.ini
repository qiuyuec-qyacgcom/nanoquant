; mypy：只对 nanoquant 包做类型检查（tests 不在范围内）
;
;   mypy            # 按本文件配置
;   mypy nanoquant/services/retention.py   # 单文件
;
; 门槛原则：既然现在是 0 错，就设成 0。加 ignore 要写清楚为什么，
; 别用 `--ignore-errors` 这种一刀切 —— 那等于把类型检查关掉还假装在检查。
[mypy]
python_version = 3.12
files = nanoquant
ignore_missing_imports = True
; 函数体没标类型也要检查：这批 bug（把 list 赋给 int、None.items()）都在函数体内
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_configs = True
show_error_codes = True
; 第三方库（SQLAlchemy Result / pydantic 泛型）在这版类型桩上噪声较多，
; 允许单点 `# type: ignore[...]`，但不允许整模块忽略
warn_unused_ignores = True
