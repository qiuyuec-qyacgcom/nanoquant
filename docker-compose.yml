services:
  nanoquant:
    build: .
    image: nanoquant:latest
    container_name: nanoquant
    restart: unless-stopped
    ports:
      - "8899:8899"
    environment:
      NANOQUANT_PORT: 8899
      NANOQUANT_HOME: /app

      NANOQUANT_DB: /app/data/nanoquant.db
      NANOQUANT_FRONTEND: /app/frontend/dist
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "/usr/local/bin/nanoquant", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
