<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NanoQuant — 登录概念稿</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    body {
      margin: 0;
      background: var(--ink);
      color: var(--text);
    }
    .login {
      width: 1440px;
      min-height: 900px;
      display: grid;
      grid-template-columns: 57% 43%;
      overflow: hidden;
    }
    .visual {
      position: relative;
      padding: 46px 54px;
      background:
        radial-gradient(circle at 78% 20%, rgba(240, 185, 11, 0.2), transparent 32%),
        radial-gradient(circle at 20% 80%, rgba(240, 185, 11, 0.06), transparent 35%),
        #08090b;
      overflow: hidden;
    }
    .visual::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(240, 185, 11, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(240, 185, 11, 0.045) 1px, transparent 1px);
      background-size: 52px 52px;
    }
    .visual::after {
      content: "";
      position: absolute;
      width: 620px;
      height: 620px;
      border: 1px solid rgba(240, 185, 11, 0.12);
      border-radius: 50%;
      right: -260px;
      bottom: -280px;
      box-shadow: 0 0 0 70px rgba(240, 185, 11, 0.025), 0 0 0 140px rgba(240, 185, 11, 0.018);
    }
    .v-top {
      position: relative;
      display: flex;
      align-items: center;
      gap: 11px;
      z-index: 1;
    }
    .v-brand {
      font-family: var(--serif);
      font-size: 18px;
    }
    .v-brand span {
      display: block;
      color: #7e8189;
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .v-mid {
      position: relative;
      z-index: 1;
      margin-top: 150px;
      max-width: 560px;
    }
    .v-mid .eyebrow {
      color: var(--gold);
    }
    .v-mid h1 {
      margin: 17px 0 0;
      font-family: var(--serif);
      font-size: 48px;
      line-height: 1.08;
      font-weight: 400;
      letter-spacing: -0.045em;
    }
    .v-mid h1 em {
      color: var(--gold);
      font-style: italic;
    }
    .v-mid p {
      max-width: 440px;
      margin: 19px 0 0;
      color: #8f929a;
      font-size: 11px;
      line-height: 1.9;
    }
    .v-stats {
      position: absolute;
      left: 54px;
      right: 54px;
      bottom: 46px;
      z-index: 1;
      display: flex;
      gap: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .v-stat {
      flex: 1;
      padding-top: 14px;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      padding-left: 18px;
    }
    .v-stat:first-child {
      border-left: 0;
      padding-left: 0;
    }
    .v-stat b {
      display: block;
      color: #f0ede4;
      font-family: var(--mono);
      font-size: 17px;
      font-weight: 500;
    }
    .v-stat span {
      display: block;
      margin-top: 5px;
      color: #656870;
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .panel {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 80px;
      background: var(--paper);
      color: #151619;
    }
    .panel::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 1px;
      background: linear-gradient(180deg, transparent, var(--gold), transparent);
      opacity: 0.55;
    }
    .form-wrap {
      width: 100%;
      max-width: 370px;
      margin-top: -30px;
    }
    .form-wrap .eyebrow {
      color: #9a7a1d;
    }
    .form-wrap h2 {
      margin: 13px 0 0;
      font-family: var(--serif);
      font-size: 34px;
      font-weight: 400;
      letter-spacing: -0.04em;
    }
    .form-wrap .lead {
      color: #7c7870;
      font-size: 11px;
      margin: 8px 0 0;
    }
    .form {
      display: grid;
      gap: 14px;
      margin-top: 33px;
    }
    .label {
      color: #4f4c47;
      font-size: 10px;
      margin-bottom: 7px;
      display: block;
    }
    .input-light {
      width: 100%;
      height: 42px;
      padding: 0 13px;
      border: 1px solid rgba(17, 17, 17, 0.16);
      background: rgba(255, 255, 255, 0.35);
      color: #17181b;
      font-family: var(--mono);
      font-size: 11px;
      outline: none;
    }
    .input-light:focus {
      border-color: var(--gold-2);
    }
    .login-btn {
      width: 100%;
      height: 43px;
      margin-top: 4px;
      background: #111;
      color: #f6f1e5;
      border: 0;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .login-btn span {
      color: var(--gold);
      margin-left: 8px;
    }
    .hint {
      color: #8e897f;
      font-size: 9px;
      line-height: 1.7;
      margin-top: 14px;
    }
    .hint b {
      color: #5c574d;
      font-weight: 600;
    }
    .security {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid rgba(17, 17, 17, 0.1);
      color: #8c867c;
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.04em;
    }
    .security i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #2ebd85;
    }
    .form-foot {
      margin-top: 42px;
      color: #9b958a;
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.05em;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <main class="login">
    <section class="visual">
      <div class="v-top">
        <div class="mark">N</div>
        <div class="v-brand">NanoQuant<span>systematic micro capital</span></div>
      </div>
      <div class="v-mid">
        <div class="eyebrow">PRIVATE TERMINAL / 2026</div>
        <h1>先活下来，<br />再谈<em>收益</em>。</h1>
        <p>策略只提出候选，风控决定是否允许下单。每一次进出、每一次参数变更，都写入同一本审计账本。</p>
      </div>
      <div class="v-stats">
        <div class="v-stat"><b>5–30m</b><span>主执行周期</span></div>
        <div class="v-stat"><b>2.41</b><span>Sharpe / 90D</span></div>
        <div class="v-stat"><b>0600</b><span>UDS / 执行侧车</span></div>
      </div>
    </section>

    <section class="panel">
      <div class="form-wrap">
        <div class="eyebrow">SECURE ACCESS</div>
        <h2>登录交易终端</h2>
        <p class="lead">仅限授权操作员。所有操作会记录到审计日志。</p>
        <form class="form">
          <div>
            <label class="label" for="user">账号</label>
            <input class="input-light" id="user" value="admin" autocomplete="username" />
          </div>
          <div>
            <label class="label" for="pass">密码</label>
            <input class="input-light" id="pass" type="password" value="••••••••••••" autocomplete="current-password" />
          </div>
          <button class="login-btn" type="button">进入终端 <span>→</span></button>
        </form>
        <div class="hint">首次登录或重置后，系统会要求修改默认密码。<b>不要在公共网络保存凭证。</b></div>
        <div class="security"><i></i> TLS 1.3 · 会话令牌 · 登录失败锁定</div>
        <div class="form-foot"><span>NANOQUANT / AUTH</span><span>v0.1.0</span></div>
      </div>
    </section>
  </main>
</body>
</html>
