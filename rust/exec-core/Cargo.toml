[package]
name = "exec-core"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["pkcs8"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "abort"