[package]
name = "exec-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "NanoQuant 执行内核 sidecar（UDS，只签名不下单）"

[[bin]]
name = "exec-service"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
# P3-1：HTTP/2 连接池。纯 Rust TLS（rustls），不依赖系统 OpenSSL，
# 避免 VPS 上缺 libssl 或版本不匹配导致构建/运行失败。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip"] }
# P3-4：sidecar 自己的台账持久化（独立库文件，不碰 legacy 内核（已退役）主库）。
# bundled 编译自带 SQLite C 源码，避免依赖系统 libsqlite3。
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "abort"
