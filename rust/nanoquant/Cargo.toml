[package]
name = "nanoquant"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "NanoQuant 主服务（Rust 实现）"
publish = false

[[bin]]
name = "nanoquant"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "io-util", "sync"] }
axum = { version = "0.8", features = ["json", "macros", "ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
rand = "0.9"
fernet = { version = "0.2.2", default-features = false, features = ["rustcrypto"] }
hex = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_IO"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
